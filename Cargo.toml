[package]
name = "de_storage_server"
version = "1.2.2"
edition = "2021"
description = "DroneEngage storage server: task, mission and news persistence for comm servers over an S2S-authenticated WebSocket, plus a read-mostly admin dashboard."
authors = ["Mohammad Said Hefny <mohammad.hefny@gmail.com>"]
license = "UNLICENSED"
publish = false

[lib]
name = "de_storage_server"
path = "src/lib.rs"

[[bin]]
name = "de_storage_server"
path = "src/main.rs"

[dependencies]
droneengage_server_common = { git = "https://github.com/DroneEngage/droneengage_server_common", branch = "master" }
base64 = "0.22"
bcrypt = "0.17"
bytes = "1"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = "2"
minijinja = { version = "2", features = ["loader"] }
rand = "0.8"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.5"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
