# pure-gates - every push.
#
#   fmt      cargo fmt --check
#   clippy   cargo clippy --all-targets, warnings are errors
#   tests    cargo test - database, handlers, quotas and S2S auth against
#            temporary SQLite files, plus the WebSocket server and the
#            dashboard on loopback ports.
#
# No comm server, no SITL, no sim bring-up.
name: pure-gates
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test
