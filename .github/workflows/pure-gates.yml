# pure-gates - every push, pure logic only.
#
#   tests    tests/*.js - mission storage, quota limits and mission
#            kinds against an in-memory better-sqlite3 database.
#            Self-contained: no real DB file, no comm server.
#
# No servers, no SITL, no sim bring-up.
name: pure-gates
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # the runner has no ssh key - rewrite the git+ssh server_common
      # dependency to anonymous https (repo is public)
      - name: git+ssh -> https for CI
        run: sed -i 's|git+ssh://git@github.com:|git+https://github.com/|g' package.json

      # package-lock.json is gitignored in this repo - npm install, not ci
      - name: install
        run: npm install --no-audit --no-fund

      - name: test
        run: npm test
